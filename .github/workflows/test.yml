name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Verify index.html is up-to-date with sources
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is out of sync with src/. Run 'npm run build' and commit."
            git --no-pager diff -- index.html | head -40
            exit 1
          fi
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
